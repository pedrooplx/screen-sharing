    - "Se a mudança proposta reverte, enfraquece ou contradiz qualquer item da seção 'Decisões de produto intencionais' no contexto do projeto, marque isso explicitamente como uma reversão deliberada e pergunte ao usuário antes de prosseguir."
  design:
    - "Mesma regra: uma decisão de design que reverte algo listado em 'Decisões de produto intencionais' precisa ser sinalizada como tal, não assumida silenciosamente como correção."

